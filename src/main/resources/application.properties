# ─────────────────────────────────────────────────────────
#  Biblioteca Universitaria — Configuración de Aplicación
# ─────────────────────────────────────────────────────────
spring.application.name=gestion-prestamos-biblioteca

# Reducir verbosidad del banner de Spring
spring.main.banner-mode=console

# Nivel de logging: INFO para aplicación, WARN para frameworks
logging.level.root=WARN
logging.level.com.biblioteca=INFO

# Formato de log más limpio para la demo
logging.pattern.console=%d{HH:mm:ss} [%-5level] %logger{36} - %msg%n
